name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/billing_kit_test
      # Not a real Stripe key. Only used to satisfy env-schema validation and
      # construct the SDK client — every Stripe call in the test suite is
      # mocked (see docs/ARCHITECTURE.md; this sandbox has no network path to
      # api.stripe.com and CI shouldn't have one either).
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_API_VERSION: 2026-06-24.dahlia
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_not_a_real_secret
      ADMIN_API_KEY: ci_placeholder_admin_write_key_not_a_real_secret
      ADMIN_READONLY_KEY: ci_placeholder_admin_readonly_key_not_a_real_secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build

      - run: npm run db:migrate

      - run: npm run test:unit

      - run: npm run test:integration

      - run: npm run test:web
